[package]
name = "pc-token"
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true

[dependencies]
encrypt-types = { workspace = true }
encrypt-dsl = { package = "encrypt-solana-dsl", path = "../../../program-sdk/dsl" }
encrypt-pinocchio = { workspace = true }
pinocchio = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }

[dev-dependencies]
encrypt-solana-test = { workspace = true }
# SolanaRuntime::send_transaction returns a Result (negative tests).
encrypt-dev = { workspace = true }
# Transaction metadata (inner instructions) for the wrap test.
litesvm = { workspace = true }
solana-transaction = { workspace = true }
bincode = { workspace = true }
encrypt-service = { workspace = true }
encrypt-compute = { workspace = true }
encrypt-types = { workspace = true }
encrypt-dsl = { package = "encrypt-solana-dsl", path = "../../../program-sdk/dsl" }
solana-sdk = { workspace = true }
mollusk-svm = { workspace = true }
solana-account = { workspace = true }
solana-pubkey = { workspace = true }
solana-instruction = { workspace = true }

# PDA derivation on the host (tests). On SBF it is a syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
mock = []
# Pin the Encrypt program id the encrypt-solana-test LiteSVM harness deploys
# at (Cq37zH...). Default builds pin the devnet Encrypt program.
localnet = []
